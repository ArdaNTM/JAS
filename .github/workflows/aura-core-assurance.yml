name: AURA Core Assurance

on:
  pull_request:
    paths:
      - "core/**"
      - "docs/22_IMPLEMENTATION/**"
      - "scripts/validate_aura_feature_tracker.py"
      - ".github/workflows/aura-core-assurance.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "core/**"
      - "docs/22_IMPLEMENTATION/**"
      - "scripts/validate_aura_feature_tracker.py"
      - ".github/workflows/aura-core-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-core-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests and bytecode compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - name: Install locked project and test dependencies
        run: uv sync --frozen --group dev
      - name: Compile Core sources and tests
        run: uv run python -m compileall -q src tests
      - name: Run Core unit tests
        run: uv run --frozen pytest -q --tb=short --basetemp="${{ runner.temp }}/aura-pytest"
      - name: Validate 117-feature engineering acceptance ledger
        run: uv run python ../scripts/validate_aura_feature_tracker.py
      - name: Verify complete production release lock
        run: uv run python scripts/verify_final_lock.py
      - name: Regenerate release lock and verify identical source inventory
        run: |
          cp ../release-manifest.final.json "$RUNNER_TEMP/aura-release-lock-original.json"
          uv run --frozen python scripts/generate_final_lock.py
          uv run --frozen python scripts/verify_final_lock.py
          uv run --frozen python -c 'import json, os; from pathlib import Path; a=json.loads((Path(os.environ["RUNNER_TEMP"])/"aura-release-lock-original.json").read_text()); b=json.loads(Path("../release-manifest.final.json").read_text()); assert all(a[k]==b[k] for k in ("files","file_count","release_digest")), "Regenerated manifest differs"; print("AURA release generator parity: PASS")'
          cp "$RUNNER_TEMP/aura-release-lock-original.json" ../release-manifest.final.json
