name: AURA Unified Integration Acceptance
on:
  pull_request:
    paths:
      - "core/**"
      - "aura-ui/src/**"
      - "docs/22_IMPLEMENTATION/**"
      - "scripts/validate_aura_feature_tracker.py"
      - ".github/workflows/aura-unified-acceptance.yml"
  push:
    branches: ["feat/aura-117-unified-integration"]
permissions:
  contents: read
jobs:
  unified:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install frozen test dependencies
        run: uv sync --frozen --group dev
      - name: Focused cross-module and memory/Gateway E2E
        run: uv run pytest -q --tb=short tests/test_unified_cross_module_e2e.py tests/test_researching_memory_authorization_e2e.py
      - name: Validate evidence tracker
        run: uv run python ../scripts/validate_aura_feature_tracker.py
      - name: Verify canonical final source lock
        run: uv run python scripts/verify_final_lock.py
