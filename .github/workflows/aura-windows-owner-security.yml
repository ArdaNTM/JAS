name: AURA Windows Owner Security

on:
  pull_request:
    paths:
      - "core/src/aura_core/evolution/**"
      - "core/tests/conftest.py"
      - "core/tests/test_owner_*.py"
      - "core/tests/test_governed_owner_receipt.py"
      - "core/tests/test_governed_activation_api.py"
      - "core/tests/test_windows_owner_acl.py"
      - "core/pyproject.toml"
      - "core/uv.lock"
      - "core/scripts/generate_final_lock.py"
      - "release-manifest.final.json"
      - ".github/workflows/aura-windows-owner-security.yml"
  push:
    branches:
      - "feat/**"
    paths:
      - "core/src/aura_core/evolution/**"
      - "core/tests/conftest.py"
      - "core/tests/test_owner_*.py"
      - "core/tests/test_governed_owner_receipt.py"
      - "core/tests/test_governed_activation_api.py"
      - "core/tests/test_windows_owner_acl.py"
      - "core/pyproject.toml"
      - "core/uv.lock"
      - "core/scripts/generate_final_lock.py"
      - "release-manifest.final.json"
      - ".github/workflows/aura-windows-owner-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-owner-tests:
    name: Real Windows NTFS owner ACL and signed receipt tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - name: Install locked Python dependencies
        run: uv sync --frozen --group dev
      - name: Windows ACL and owner governance acceptance
        run: |
          uv run --frozen python -m pytest -q tests/test_owner_enrollment.py tests/test_owner_activation.py tests/test_governed_activation_api.py tests/test_governed_owner_receipt.py tests/test_owner_control_plane_http.py tests/test_windows_owner_acl.py
      - name: Verify JAS immutable production release inventory
        run: uv run --frozen python scripts/verify_final_lock.py
