name: AURA Subsystem Pack 4 Assurance
on:
  pull_request:
    paths:
      - "core/**"
      - "aura-ui/src/**"
      - ".github/workflows/aura-subsystem-pack4.yml"
  push:
    branches: ["feat/aura-subsystem-pack-4"]
permissions:
  contents: read
jobs:
  focused-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install locked project dependencies
        working-directory: core
        run: uv sync --frozen --group dev
      - name: Focused security and regression tests
        working-directory: core
        run: uv run pytest -q --tb=short tests/test_subsystem_pack4.py
      - name: Verify final release lock
        working-directory: core
        run: uv run python scripts/verify_final_lock.py

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: aura-ui/package-lock.json
      - name: Build local HUD and Three.js game
        working-directory: aura-ui
        run: |
          npm ci
          npm run build
