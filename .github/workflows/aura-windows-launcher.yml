name: AURA Windows launcher validation

on:
  pull_request:
    paths:
      - "scripts/Start-AURA.bat"
      - "scripts/start_aura.ps1"
      - "scripts/aura-app-window.ps1"
      - "scripts/aura-env.ps1"
      - "scripts/test-aura-env.ps1"
      - "scripts/test-aura-app-window.ps1"
      - "scripts/aura-processes.ps1"
      - "scripts/test-aura-processes.ps1"
      - "scripts/setup-turkish-tts.ps1"
      - "scripts/test-piper-voice-config.ps1"
      - "core/scripts/validate_piper_voice_config.py"
      - "core/tests/test_piper_voice_config_validation.py"
      - "aura-ui/vite.config.ts"
      - "aura-ui/src/**"
      - "core/src/aura_core/runtime/**"
      - "core/src/aura_core/application/api.py"
      - "core/src/aura_core/tts/**"
      - "aura-ui/tests/aura-proxy.test.mjs"
      - ".github/workflows/aura-windows-launcher.yml"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "scripts/Start-AURA.bat"
      - "scripts/start_aura.ps1"
      - "scripts/aura-app-window.ps1"
      - "scripts/aura-env.ps1"
      - "scripts/test-aura-env.ps1"
      - "scripts/test-aura-app-window.ps1"
      - "scripts/aura-processes.ps1"
      - "scripts/test-aura-processes.ps1"
      - "scripts/setup-turkish-tts.ps1"
      - "scripts/test-piper-voice-config.ps1"
      - "core/scripts/validate_piper_voice_config.py"
      - "core/tests/test_piper_voice_config_validation.py"
      - "aura-ui/vite.config.ts"
      - "aura-ui/src/**"
      - "core/src/aura_core/runtime/**"
      - "core/src/aura_core/application/api.py"
      - "core/src/aura_core/tts/**"
      - "aura-ui/tests/aura-proxy.test.mjs"
      - ".github/workflows/aura-windows-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-env-parser:
    name: Windows PowerShell 5.1 and PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 parser regression
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test-aura-env.ps1
      - name: PowerShell 7 parser regression
        shell: pwsh
        run: ./scripts/test-aura-env.ps1
      - name: Chromium app-mode arguments (Windows PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test-aura-app-window.ps1
      - name: Chromium app-mode arguments (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-aura-app-window.ps1
      - name: Owned process detection and fixed ports (PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test-aura-processes.ps1
      - name: Owned process detection and fixed ports (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-aura-processes.ps1
      - name: Install UI dependencies
        working-directory: aura-ui
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Authenticated loopback Vite proxy smoke test
        working-directory: aura-ui
        shell: pwsh
        run: node tests/aura-proxy.test.mjs
      - name: Compile UI TypeScript and build Vite UI
        working-directory: aura-ui
        shell: pwsh
        run: npm run build
      - name: Set up Python for Piper voice JSON regression
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Piper Unicode configuration regression (Windows PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test-piper-voice-config.ps1
      - name: Piper Unicode configuration regression (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-piper-voice-config.ps1
      - name: Check optional Turkish TTS setup script syntax
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content scripts/setup-turkish-tts.ps1 -Raw))

