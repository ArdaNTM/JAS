[project]
name = "aura-core"
version = "0.1.0"
description = "AURA JAS Core Runtime"
requires-python = "==3.13.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "langgraph==1.2.9",
    "mcp==2.0.0",
    "httpx==0.28.1",
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.30,<1",
    "qdrant-client>=1.12,<2",
    "playwright>=1.50,<2",
    "faster-whisper>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_core"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
