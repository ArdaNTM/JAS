services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${AURA_POSTGRES_PASSWORD:?set AURA_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:v1.11.1
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
  core:
    build: ..
    environment:
      AURA_POSTGRES_DSN: postgresql://aura:${AURA_POSTGRES_PASSWORD}@postgres:5432/aura
      AURA_QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
