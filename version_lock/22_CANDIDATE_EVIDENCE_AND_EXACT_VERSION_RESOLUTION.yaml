    name:
      "Candidate Evidence and Exact Version Resolution"

    version:
      "1.1"

    status:
      "IN_PROGRESS"

    authority:
      - "JAS v1"
      - "Approved Stack v1.0"
      - "19_APPROVED_MODELS.md"
      - "20_APPROVED_MCP_SERVERS.md"
      - "21_VERSION_LOCK_CANDIDATE.yaml"
      - "14_COMPATIBILITY_RESOLUTION.yaml"
      - "20_CROSS_DOMAIN_COMPATIBILITY_VALIDATION.yaml"
      - "24_FINAL_EXACT_VERSION_RESOLUTION.yaml"
      - "JAS host snapshot 2026-08-13"

    final_lock:
      false


  # ==========================================================
  # 2. PURPOSE
  # ==========================================================

  purpose:
    >
    This document records authoritative evidence used to resolve
    exact production candidates.

    A version may only advance toward final Version Lock when its
    identity, compatibility, security, licensing and reproducibility
    requirements are supported by sufficient evidence.

    Host-installed versions are recorded as observed host evidence
    and SHALL NOT automatically be promoted to selected production
    versions.


  # ==========================================================
  # 3. EVIDENCE LEVELS
  # ==========================================================

  evidence_levels:

    E0:
      name:
        "UNVERIFIED"

      meaning:
        >
        No authoritative evidence collected.


    E1:
      name:
        "DISCOVERED"

      meaning:
        >
        Candidate or host-installed version discovered from a
        source but not yet independently validated.


    E2:
      name:
        "AUTHORITATIVE"

      meaning:
        >
        Candidate verified against an authoritative upstream source.


    E3:
      name:
        "COMPATIBILITY_VALIDATED"

      meaning:
        >
        Candidate verified against directly connected JAS components.


    E4:
      name:
        "RELEASE_READY"

      meaning:
        >
        Candidate has passed version, compatibility, security,
        licensing, reproducibility and artifact-identity checks.


    E5:
      name:
        "LOCKED"

      meaning:
        >
        Candidate has been promoted into final Version Lock.


  promotion_rule:

    E0_to_E1:
      "Candidate discovery"

    E1_to_E2:
      "Authoritative source verification"

    E2_to_E3:
      "Compatibility verification"

    E3_to_E4:
      "Release validation"

    E4_to_E5:
      "Final Version Lock approval"


  # ==========================================================
  # 4. EVIDENCE REQUIREMENTS
  # ==========================================================

  evidence_requirements:

    package:

      - "Official package/release source"
      - "Exact version"
      - "Supported runtime"
      - "License"
      - "Integrity"


    container:

      - "Official image source"
      - "Exact tag"
      - "Digest"
      - "Architecture"
      - "Base image identity"


    model:

      - "Official model repository"
      - "Exact model ID"
      - "Exact revision"
      - "Artifact identity"
      - "Quantization"
      - "Runtime"
      - "License"


    ollama_model:

      - "Official Ollama Library identity"
      - "Exact model tag"
      - "Local manifest identity"
      - "Full immutable digest"
      - "Runtime version"
      - "GPU runtime validation"


    mcp_server:

