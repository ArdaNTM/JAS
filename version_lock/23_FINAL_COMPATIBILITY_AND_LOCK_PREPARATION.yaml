# ============================================================
# JARVIS / JAS
# VERSION LOCK v1 — FINAL COMPATIBILITY
# AND LOCK PREPARATION
# ============================================================

final_compatibility_and_lock_preparation:

  schema_version: "1.0"

  project:
    name: "JARVIS"
    architecture: "JAS"
    architecture_version: "JAS v1"


  # ==========================================================
  # 1. DOCUMENT
  # ==========================================================

  document:

    id: "JAS-VL-023"

    name:
      "Final Compatibility and Lock Preparation"

    version: "1.0"

    status:
      "LOCK_PREPARATION"

    final_version_lock:
      false

    authority:
      - "JAS v1"
      - "Approved Stack v1.0"
      - "19_APPROVED_MODELS.md"
      - "20_APPROVED_MCP_SERVERS.md"
      - "21_VERSION_LOCK_CANDIDATE.yaml"
      - "22_CANDIDATE_EVIDENCE_AND_EXACT_VERSION_RESOLUTION.yaml"


  # ==========================================================
  # 2. PURPOSE
  # ==========================================================

  purpose:
    >
    This document performs the final compatibility gate before
    production Version Lock generation.

    Every production component must satisfy:

      architectural approval
        ->
      exact identity
        ->
      compatibility
        ->
      security
        ->
      licensing
        ->
      reproducibility
        ->
      artifact integrity
        ->
      release readiness

    No unresolved blocker may be silently promoted into the final
    Version Lock.


  # ==========================================================
  # 3. FINAL GATE STATES
  # ==========================================================

  gate_states:

    PASS:
      meaning:
        "Requirement has been satisfied."

    CONDITIONAL:
      meaning:
        "Requirement is satisfied only under an explicit condition."

    PENDING:
      meaning:
        "Required evidence or validation is still missing."

    BLOCKED:
      meaning:
        "A prerequisite prevents promotion."

    NOT_APPLICABLE:
      meaning:
        "Requirement does not apply."

    READY:
      meaning:
        "Component is eligible for final Version Lock."


  # ==========================================================
  # 4. GLOBAL LOCK RULE
  # ==========================================================

  global_lock_rule:

    production_component:

      must_have:

        - "Approved architectural role"
        - "Exact version"
        - "Exact revision where applicable"
        - "Platform"
        - "Architecture"
        - "Integrity"
        - "Compatibility evidence"
        - "Security validation"
        - "License validation"


    artifact_component:

      additionally_requires:

        - "Immutable artifact identity"
        - "Digest where available"
        - "SBOM"
        - "Provenance"
        - "Signature"


    model_component:

      additionally_requires:

        - "Exact model ID"
        - "Exact variant"
        - "Revision"
        - "Artifact digest where available"
        - "Quantization where applicable"
        - "Runtime"
        - "License"


    mcp_component:

      additionally_requires:

        - "Server identity"
        - "Publisher"
        - "Version"
        - "Revision"
        - "Protocol version"
        - "SDK version"
        - "Transport"
        - "Permission profile"


  # ==========================================================
  # 5. CORE RUNTIME GATE
  # ==========================================================

  core_runtime:

    python:

      architectural_approval:
        "PASS"

      exact_version:
        "PENDING"

      platform:
        "PENDING"

      compatibility:
        "PENDING"

      security:
        "PENDING"

      license:
        "PENDING"

      reproducibility:
        "PENDING"

      final_state:
        "BLOCKED"


    cpython:

