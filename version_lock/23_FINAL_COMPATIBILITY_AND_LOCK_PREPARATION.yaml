    document:
      "24_FINAL_EXACT_VERSION_RESOLUTION.yaml"

    objective:
      >
      Resolve every P0/P1 blocker using authoritative upstream
      evidence and produce the exact candidate set required for
      the final compatibility run.

    sequence:

