        digest:
          algorithm: "SHA-256"
          value: null

      protocol:
        version: "2026-07-28"

      sdk:
        name: "MCP Client SDK"
        version: null

      transport:
        selected: null
        candidates:
          - "stdio"
          - "streamable-http"

      runtime:
        name: null
        version: null

      permissions:

        default: "NONE"

        required:
          - "Time query"

        network:
          required: false

        filesystem:
          required: false

        shell:
          required: false

      security:

        sandbox_required: false

        credential_required: false

        outbound_network:
          allowed: false

      license:
        value: null
        validation_status: "PENDING"

      validation:

        protocol_compatibility: false
        artifact_integrity: false
        license: false
        security: false
        permission_profile: false
        runtime: false

      final_status: "PENDING_SERVER_RESOLUTION"


