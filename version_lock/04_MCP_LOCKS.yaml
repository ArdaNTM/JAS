# ============================================================
# JARVIS / JAS
# VERSION LOCK v1 — MCP LOCKS
# ============================================================

version_lock_mcp_locks:

  schema_version: "1.0"

  project:
    name: "JARVIS"
    architecture: "JAS"
    architecture_version: "JAS v1"

  lock:
    version: "1.0"
    status: "CANDIDATE"
    authority: "VERSION_LOCK_v1"

  # ----------------------------------------------------------
  # IMPORTANT
  # ----------------------------------------------------------
  #
  # MCP server approval and MCP server version locking are
  # separate governance decisions.
  #
  # An approved MCP server SHALL NOT become a production
  # dependency until its exact implementation identity,
  # protocol compatibility, runtime, transport, license,
  # permissions and artifact integrity have been validated.
  #
  # Every enabled production MCP server receives an individual
  # lock entry.
  #
  # ==========================================================


  # ==========================================================
  # 1. MCP CLIENT
  # ==========================================================

  client:

    - id: "SW-017"

      name: "MCP Client SDK"

      component_type: "protocol_sdk"

      approved_status: "APPROVED"

      lock_status: "CANDIDATE_LOCK"

      sdk:
        version: null
        runtime: "Python"
        runtime_version: null

      protocol:
        target: "2026-07-28"
        exact_version: null
        compatibility_status: "PENDING"

      package:
        name: null
        registry: null
        artifact_digest: null

      transport_support:

        stdio: true
        streamable_http: true
        sse:
          status: "COMPATIBILITY_DEPENDENT"

      security:

        authentication:
          supported: true
          mechanism: "PENDING"

        authorization:
          required: true

      validation:

        protocol_compatibility: false
        runtime_compatibility: false
        transport_validation: false
        security_validation: false

      final_status: "PENDING_VERSION_RESOLUTION"


  # ==========================================================
  # 2. INTERNAL MCP GATEWAY
  # ==========================================================

  gateway:

    - id: "MCP-GATEWAY"

      name: "JARVIS MCP Gateway"

      component_type: "internal_service"

      approved_status: "APPROVED"

      lock_status: "INTERNAL"

      version_source:
        authority: "JARVIS Release Version"

      source_revision:
        required: true
        value: null

      responsibilities:

        - "MCP server registration"
        - "Server trust evaluation"
        - "Permission enforcement"
        - "Transport policy enforcement"
        - "Credential isolation"
        - "Capability filtering"
        - "Audit integration"
        - "Server lifecycle management"

      security:

        default_policy: "DENY"

        least_privilege: true

        audit_required: true

      final_status: "GOVERNED_BY_JARVIS_RELEASE"


  # ==========================================================
  # 3. APPROVED MCP SERVER REGISTRY
  # ==========================================================

  approved_server_registry:

    authority:
      document: "20_APPROVED_MCP_SERVERS.md"

    rule: >
      This registry represents the approved MCP capability families.
      It does not itself constitute a production Version Lock.

    production_rule: >
      Only individually resolved and validated server entries may
      become LOCKED.


  # ==========================================================
  # 4. TIME MCP
  # ==========================================================

  servers:

    - id: "MCP-TIME"

      name: "Time MCP Server"

      capability: "Time"

      approved_status: "APPROVED"

      lock_status: "CANDIDATE_LOCK"

      trust_tier: "T0"

      publisher:
        name: null
        verified: false

      repository:
        url: null
        revision: null

      package:
        name: null
        version: null
        registry: null

      artifact:
