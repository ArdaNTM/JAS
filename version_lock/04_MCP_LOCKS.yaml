  # ==========================================================
  # 15. PER-SERVER LOCK IDENTITY
  # ==========================================================

  lock_identity_requirements:

    required:

      - "server_id"
      - "publisher"
      - "version"
      - "revision"
      - "artifact_digest"
      - "protocol_version"
      - "sdk_version"
      - "transport"
      - "runtime"
      - "license"
      - "permission_profile"

    strongly_recommended:

      - "repository"
      - "build_identity"
      - "artifact_format"
      - "source_commit"
      - "container_image"
      - "container_digest"

    prohibited:

      - "latest"
      - "main"
      - "master"
      - "unversioned_registry_entry"


  # ==========================================================
  # 16. TRANSPORT GOVERNANCE
  # ==========================================================

  transport_policy:

    approved:

      - "stdio"
      - "streamable-http"

    conditional:

      - "SSE"

    requirements:

      stdio:
        process_isolation: true
        executable_identity_required: true

      streamable_http:
        tls_required_for_remote: true
        authentication_required_where_applicable: true
        origin_validation_required: true

      sse:
        status: "COMPATIBILITY_DEPENDENT"
        migration_review_required: true


  # ==========================================================
  # 17. TRUST TIERS
  # ==========================================================

  trust_tiers:

    T0:
      description: >
        Low-risk deterministic capability with no meaningful
        access to sensitive resources.

    T1:
      description: >
        Restricted local capability requiring explicit permissions.

    T2:
      description: >
        Network-facing or externally interacting capability.

    T3:
      description: >
        Capability that can access important project or data resources.

    T4:
      description: >
        Administrative, privileged or potentially destructive
        capability.

  default_policy:
    unknown_server: "DENY"
    unapproved_server: "DENY"
    missing_digest: "DENY_FOR_PRODUCTION"
    missing_publisher: "DENY_FOR_PRODUCTION"
    missing_permission_profile: "DENY"
    protocol_mismatch: "DENY"


  # ==========================================================
  # 18. SERVER SECURITY GATE
  # ==========================================================

  security_gate:

    required_before_production_lock:

      - "Publisher verification"
      - "Repository verification"
      - "Exact version verification"
      - "Immutable revision verification"
      - "Artifact digest verification"
      - "Protocol compatibility"
      - "SDK compatibility"
      - "Transport validation"
      - "Permission review"
      - "Credential review"
      - "Sandbox validation where required"
      - "License validation"
      - "Runtime validation"

    failure_action:
      "DO_NOT_LOCK"


  # ==========================================================
  # 19. MCP SERVER UPDATE POLICY
  # ==========================================================

  update_policy:

    automatic_updates:
      production: false
      development: "ALLOWED_WITHOUT_PRODUCTION_PROMOTION"

    update_sequence:

      - "New server release detected"
      - "Publisher verification"
      - "Security review"
      - "Protocol compatibility review"
      - "SDK compatibility review"
      - "Permission review"
      - "Artifact verification"
      - "Regression testing"
      - "Integration testing"
      - "New Version Lock candidate"
      - "Approval"
      - "Promotion to LOCKED"

    rollback:
      supported: true
      previous_lock_required: true


  # ==========================================================
  # 20. MCP SERVER DRIFT
  # ==========================================================

  drift_detection:

    required: true

    detect:

      - "Server version drift"
      - "Revision drift"
      - "Digest drift"
      - "Protocol drift"
      - "SDK drift"
      - "Transport drift"
      - "Runtime drift"
      - "Permission drift"
      - "Publisher drift"

    unauthorized_drift:
      action: "COMPLIANCE_FAILURE"


  # ==========================================================
  # 21. PROFILE POLICY
  # ==========================================================

  profiles:

    minimal:
      enabled_servers: []

    development:
      permitted:

        - "MCP-TIME"
        - "MCP-FILESYSTEM"
        - "MCP-GIT"
        - "MCP-SEQUENTIAL-THINKING"
        - "MCP-EVERYTHING"

      restrictions:
        - "Explicit enablement"
        - "Sandboxing where applicable"
        - "No unrestricted credentials"

    browser:
      permitted:

        - "MCP-BROWSER"

      restrictions:
        - "Explicit session"
        - "Navigation policy"
        - "Sandbox"

    data:
      permitted:

        - "MCP-DATABASE"
        - "MCP-MEMORY"

      restrictions:
        - "Read-only database default"
        - "Scoped credentials"
        - "Data isolation"

    github:
      permitted:

        - "MCP-GITHUB"

      restrictions:
        - "Scoped credentials"
        - "Repository restrictions"
        - "Write operations disabled by default"

    infrastructure:
      permitted:

        - "MCP-DOCKER"

      restrictions:
        - "Development only"
        - "Privileged operations explicitly prohibited"
        - "Host access explicitly reviewed"


  # ==========================================================
  # 22. PRODUCTION BASELINE
  # ==========================================================

  production_baseline:

    mandatory:
      - "MCP Client SDK"
      - "JARVIS MCP Gateway"

    optional:
      - "MCP-TIME"
      - "MCP-FILESYSTEM"
      - "MCP-GIT"
      - "MCP-FETCH"
      - "MCP-MEMORY"
      - "MCP-BROWSER"
      - "MCP-DATABASE"
      - "MCP-GITHUB"

    prohibited:
      - "MCP-DOCKER"
      - "MCP-SEQUENTIAL-THINKING"
      - "MCP-EVERYTHING"

    rule:
      >
      Optional MCP servers enter a production profile only after
      their individual lock identity and security policy have been
      resolved.


  # ==========================================================
  # 23. VALIDATION STATUS
  # ==========================================================

  validation:

    protocol_version_validated: false

    sdk_version_validated: false

    server_versions_resolved: false

    server_revisions_resolved: false

    artifact_digests_resolved: false

    publisher_verification_complete: false

    transport_validation_complete: false

    permission_validation_complete: false

    security_validation_complete: false

    license_validation_complete: false

    runtime_validation_complete: false

    integration_validation_complete: false

    final_lock_status: "CANDIDATE"


  # ==========================================================
  # 24. NEXT PHASE
  # ==========================================================

  next_phase:

    name: "MCP Exact Server Resolution"

    sequence:

      - "Resolve exact MCP Client SDK version"
      - "Verify MCP protocol target"
      - "Resolve Time MCP publisher and artifact"
      - "Resolve Filesystem MCP implementation"
      - "Resolve Git MCP implementation"
      - "Resolve Fetch MCP implementation"
      - "Resolve Memory MCP implementation"
      - "Resolve Browser MCP implementation"
      - "Resolve Database MCP implementation"
      - "Resolve GitHub MCP implementation"
      - "Resolve exact server revisions"
      - "Resolve artifact digests"
      - "Validate transports"
      - "Validate permission profiles"
      - "Validate licenses"
