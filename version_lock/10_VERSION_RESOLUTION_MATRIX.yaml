# ============================================================
# JARVIS / JAS
# VERSION LOCK v1 — VERSION RESOLUTION MATRIX
# ============================================================

version_resolution_matrix:

  schema_version: "1.0"

  project:
    name: "JARVIS"
    architecture: "JAS"
    architecture_version: "JAS v1"

  resolution:
    version: "1.0"
    status: "CANDIDATE"
    authority: "VERSION_LOCK_v1"

    purpose:
      >
      Central resolution matrix for determining the exact versions,
      revisions, artifacts and compatibility relationships required
      to produce the final JAS Version Lock v1.

    important_rule:
      >
      This matrix is a resolution control document. It does not
      automatically select the newest upstream release. Every final
      selection must satisfy architectural, dependency, platform,
      security and reproducibility requirements.


  # ==========================================================
  # 1. RESOLUTION STATES
  # ==========================================================

  resolution_states:

    UNRESOLVED:
      description:
        "No candidate has yet been selected."

    CANDIDATE:
      description:
        "One or more candidate versions are under evaluation."

    COMPATIBILITY_CHECK:
      description:
        "Candidate is undergoing dependency and runtime compatibility validation."

    SECURITY_CHECK:
      description:
        "Candidate is undergoing vulnerability, provenance and integrity validation."

    PLATFORM_CHECK:
      description:
        "Candidate is undergoing OS, architecture and hardware validation."

    APPROVED_CANDIDATE:
      description:
        "Candidate passed required technical evaluations but is not yet final."

    LOCKED:
      description:
        "Exact immutable identity has been validated and approved."

    REJECTED:
      description:
        "Candidate failed one or more mandatory requirements."

    DEPRECATED:
      description:
        "Previously locked component is retained for historical reproducibility."


  # ==========================================================
  # 2. RESOLUTION PRIORITY
  # ==========================================================

  selection_priority:

    order:

      - "Architectural compatibility"
      - "Runtime compatibility"
      - "Dependency compatibility"
      - "Model compatibility"
      - "MCP compatibility"
      - "Platform compatibility"
      - "Security"
      - "License compatibility"
      - "Reproducibility"
      - "Performance"
      - "Maintenance outlook"
      - "Developer experience"

    newest_version_rule:
      >
      Newest available upstream version SHALL NOT receive priority
      merely because it is newer.

    stable_version_preference:
      >
      When multiple candidates satisfy all mandatory requirements,
      preference SHOULD be given to the most stable supported
      candidate with the strongest compatibility margin.


  # ==========================================================
  # 3. RESOLUTION SOURCES
  # ==========================================================

  authoritative_sources:

    architecture:

      - "JAS v1 Architecture"

    approved_stack:

      - "Approved Stack Overview"
      - "02_CORE_RUNTIME_AND_PROGRAMMING_LANGUAGES.md"

    software:

      - "21_APPROVED_SOFTWARE_MATRIX.md"

    models:

      - "19_APPROVED_MODELS.md"

    mcp:

      - "20_APPROVED_MCP_SERVERS.md"

    support:

      - "24_VERSION_SUPPORT_POLICY.md"

    version_lock:

      - "01_VERSION_LOCK_MANIFEST.yaml"
      - "02_COMPONENT_LOCKS.yaml"
      - "03_MODEL_LOCKS.yaml"
      - "04_MCP_LOCKS.yaml"
      - "05_PLATFORM_LOCKS.yaml"
      - "06_ARTIFACT_AND_CONTAINER_LOCKS.yaml"
      - "07_BUILD_TOOLCHAIN_LOCKS.yaml"
      - "08_DEPENDENCY_LOCK_POLICY.yaml"
      - "09_SECURITY_AND_INTEGRITY_LOCKS.yaml"


  # ==========================================================
  # 4. RESOLUTION RECORD SCHEMA
  # ==========================================================

  resolution_record:

    required_fields:

      - "component_id"
      - "component_name"
      - "category"
      - "approved_source"
      - "candidate_version"
      - "candidate_revision"
      - "candidate_artifact"
      - "platform"
      - "architecture"
      - "runtime"
      - "dependency_state"
      - "security_state"
      - "license_state"
      - "compatibility_state"
      - "decision"
      - "decision_reason"

    immutable_identity:

      required_for_locked:

        - "exact_version"
        - "exact_revision_or_release"
        - "artifact_digest_where_applicable"
        - "platform"
        - "architecture"


