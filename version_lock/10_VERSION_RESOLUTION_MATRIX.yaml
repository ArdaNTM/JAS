        - "Exact revision resolved where applicable"
        - "Artifact digest resolved where applicable"
        - "Dependency compatibility passed"
        - "Runtime compatibility passed"
        - "Platform compatibility passed"
        - "Security validation passed"
        - "License validation passed"
        - "Integrity validation passed"
        - "Reproducibility validation passed"

      prohibited:

        - "Floating version"
        - "Mutable tag"
        - "Unverified artifact"
        - "Unknown dependency graph"
        - "Known critical vulnerability"
        - "Unresolved mandatory dependency"


