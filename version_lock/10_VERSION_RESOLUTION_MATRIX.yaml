    phase_8:
      name: "Native/GPU"
      components:
        - "Rust if enabled"
        - "C/C++ if enabled"
        - "CUDA if enabled"

    phase_9:
      name: "Security"
      components:
        - "SBOM"
        - "Provenance"
        - "Signatures"
        - "Vulnerability scanner"

    phase_10:
      name: "Release"
      components:
        - "Complete dependency graph"
        - "Complete artifact graph"
        - "Final Version Lock"


  # ==========================================================
  # 25. CURRENT RESOLUTION STATUS
  # ==========================================================

  status_summary:

    architecture_validated: true

    inventory_available: true

    exact_versions_resolved: false

    exact_revisions_resolved: false

    artifact_digests_resolved: false

    dependency_graph_resolved: false

    runtime_compatibility_resolved: false

    model_compatibility_resolved: false

    mcp_compatibility_resolved: false

    platform_compatibility_resolved: false

    security_validation_complete: false

    license_validation_complete: false

    reproducibility_validation_complete: false

    final_lock_ready: false

    status: "RESOLUTION_NOT_STARTED"


  # ==========================================================
  # 26. NEXT PHASE
  # ==========================================================

  next_phase:

    name: "Candidate Version Research and Resolution"

    sequence:

      - "Populate candidate versions from authoritative sources"
      - "Evaluate runtime compatibility"
      - "Evaluate dependency compatibility"
      - "Evaluate model compatibility"
      - "Evaluate MCP compatibility"
      - "Evaluate platform compatibility"
      - "Evaluate security status"
      - "Evaluate license status"
      - "Evaluate artifact identity"
      - "Reject incompatible candidates"
      - "Select approved candidates"
      - "Run reproducibility validation"
      - "Promote candidates to LOCKED"
      - "Generate final Version Lock v1"

  governing_rule:
    >
    Version resolution SHALL be performed as a compatibility problem,
    not as an independent latest-version selection problem.