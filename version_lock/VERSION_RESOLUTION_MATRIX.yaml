# =============================================================================
# 25. EVIDENCE REQUIREMENTS
# =============================================================================

evidence_requirements:

  official_documentation:
    required: true

  official_release_information:
    required: true

  official_license:
    required: true

  official_security_information:
    required: true

  compatibility_information:
    required: true

  benchmark_information:
    required_when_relevant: true

  community_information:
    allowed: true

  third_party_analysis:
    allowed: true

  source_priority:

    - official_documentation

    - official_repository

    - official_release_notes

    - official_security_advisories

    - official_package_registry

    - reputable_independent_source

    - community_source


# =============================================================================
# 26. RESEARCH RULES
# =============================================================================

research_rules:

  use_current_information: true

  verify_release_status: true

  verify_support_status: true

  verify_security_status: true

  verify_license: true

  verify_platform_support: true

  verify_runtime_compatibility: true

  verify_dependency_compatibility: true

  do_not_assume_latest_is_best: true

  do_not_select_based_on_popularity_only: true


# =============================================================================
# 27. VERSION SELECTION PRINCIPLE
# =============================================================================

selection_principle:

  description: >
    Select the newest suitable version that satisfies all mandatory
    architectural, compatibility, security, support, license, platform,
    reproducibility, and operational requirements.

  priority_order:

    - hard_block_constraints

    - architecture_compatibility

    - security

    - compatibility

    - support_lifecycle

    - reproducibility

    - platform_compatibility

    - functional_capability

    - reliability

    - performance

    - resource_usage

    - maintainability

    - ecosystem

    - documentation

    - migration_risk


# =============================================================================
# 28. "LATEST" POLICY
# =============================================================================

latest_policy:

  prohibited_as_final_decision: true

  allowed_for_research: true

  final_selection_requires_exact_identity: true


# =============================================================================
# 29. SECURITY UPDATE POLICY
# =============================================================================

security_updates:

  expedited_review_allowed: true

  validation_required: true

  regression_testing_required: true

  emergency_override_allowed: false


# =============================================================================
# 30. MODEL UPDATE POLICY
# =============================================================================

model_updates:

  behavioral_change_assumed: true

  regression_evaluation_required: true

  performance_evaluation_required: true

  resource_evaluation_required: true

  safety_evaluation_required: true


# =============================================================================
# 31. CONTAINER UPDATE POLICY
# =============================================================================

container_updates:

  digest_required_for_production: true

  tag_alone_sufficient: false

  rebuild_validation_required: true


# =============================================================================
# 32. MCP UPDATE POLICY
# =============================================================================

mcp_updates:

  security_review_required: true

  protocol_compatibility_required: true

  permission_review_required: true


# =============================================================================
# 33. BROWSER UPDATE POLICY
# =============================================================================

browser_updates:

  compatibility_testing_required: true

  regression_testing_required: true

  automation_framework_compatibility_required: true


# =============================================================================
# 34. DATABASE UPDATE POLICY
# =============================================================================

database_updates:

  migration_testing_required: true

  backup_validation_required: true

  rollback_validation_required: true


# =============================================================================
# 35. FINAL SELECTION REQUIREMENTS
# =============================================================================

final_selection_requirements:

  every_production_component:
    must_have:
      - exact_or_explicit_lock_policy
      - approved_stack_traceability
      - jas_traceability
      - source
      - license_status
      - support_status
      - security_status
      - compatibility_status

  immutable_artifacts:
    must_have:
      - digest_or_immutable_revision


# =============================================================================
# 36. RESOLUTION GATE
# =============================================================================

resolution_gate:

  requirements:

    approved_stack_coverage: false

    component_inventory_complete: false

    all_candidates_researched: false

    compatibility_validated: false

    security_validated: false

    license_validated: false

    support_validated: false

    reproducibility_validated: false

  status: "BLOCKED"


# =============================================================================
# 37. OUTPUT
# =============================================================================

output:

  master_lock:
    file: "VERSION_LOCK.yaml"
    status: "NOT_READY"

  schema:
    file: "VERSION_LOCK.schema.json"
    status: "NOT_READY"

  metadata:
    file: "VERSION_LOCK_METADATA.yaml"
    status: "NOT_READY"


# =============================================================================
# 38. COMPLETION CRITERIA
# =============================================================================

completion_criteria:

  component_inventory_complete: false

  all_production_components_resolved: false

  all_selected_versions_validated: false

  all_artifacts_verified: false

  all_license_reviews_passed: false

  all_security_reviews_passed: false

  all_support_reviews_passed: false

  all_cross_component_compatibility_validated: false

  master_lock_generated: false

  schema_validation_passed: false

  environment_validation_passed: false

  fingerprint_generated: false

  version_lock_frozen: false


# =============================================================================
# 39. NEXT PHASE
# =============================================================================

next_phase:

  name: "VERSION_RESOLUTION_EXECUTION"

  description: >
    Resolve every READY_FOR_VERSION_RESOLUTION component from the
    Component Inventory into an evidence-backed version, revision,
    digest, or explicitly justified compatibility policy.

  required_inputs:

    - VERSION_LOCK_SPEC.md

    - VERSION_LOCK_COMPONENT_INVENTORY.yaml

    - Approved Stack v1

    - Version Support Policy

    - License and Compliance Policy

    - Security Stack

  expected_output:

    - completed component resolution records

    - rejected candidate records

    - compatibility matrix

    - decision log

    - validated selected versions


# =============================================================================
# END OF VERSION RESOLUTION MATRIX
# =============================================================================