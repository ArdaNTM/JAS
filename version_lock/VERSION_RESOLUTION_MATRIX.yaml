# =============================================================================
# JARVIS — VERSION RESOLUTION MATRIX
# =============================================================================
#
# Project: JARVIS
# Architecture: JAS v1
# Document: VERSION_RESOLUTION_MATRIX.yaml
# Version: 1.0
# Status: DRAFT
#
# Purpose:
#   This document records the process used to resolve approved technologies
#   into exact, supported, reproducible versions for Version Lock v1.
#
# Important:
#   This document is NOT the final Version Lock.
#
#   It records:
#     - candidate versions
#     - evaluation criteria
#     - compatibility findings
#     - security findings
#     - support findings
#     - license findings
#     - selected versions
#     - rejected candidates
#     - decision rationale
#
# Authority:
#   JAS v1
#
# Parent:
#   VERSION_LOCK_SPEC.md
#   VERSION_LOCK_COMPONENT_INVENTORY.yaml
#
# Final Consumer:
#   VERSION_LOCK.yaml
#
# =============================================================================


metadata:

  project:
    name: "JARVIS"
    architecture: "JAS v1"

  document:
    name: "VERSION_RESOLUTION_MATRIX.yaml"
    version: "1.0"
    status: "DRAFT"
    phase: "VERSION_RESOLUTION"

  authority:
    primary: "JAS v1"
    technology_source: "Approved Stack v1"
    inventory_source: "VERSION_LOCK_COMPONENT_INVENTORY.yaml"

  purpose:
    description: >
      Resolve every production-relevant Version Lock component from an
      approved technology into a specific reproducible version, revision,
      digest, or compatible version policy.

  rules:

    no_unapproved_technology: true

    no_implicit_latest: true

    no_unbounded_version_ranges: true

    require_traceability: true

    require_compatibility_review: true

    require_security_review: true

    require_support_review: true

    require_license_review: true

    require_artifact_identity_when_available: true

    require_reproducibility: true


# =============================================================================
# 1. RESOLUTION STATES
# =============================================================================

resolution_states:

  - PENDING

  - RESEARCHING

  - CANDIDATES_IDENTIFIED

  - COMPATIBILITY_REVIEW

  - SECURITY_REVIEW

  - SUPPORT_REVIEW

  - LICENSE_REVIEW

  - SELECTED

  - VALIDATED

  - REJECTED

  - BLOCKED


# =============================================================================
# 2. DECISION TYPES
# =============================================================================

decision_types:

  - NEW_SELECTION

  - VERSION_UPDATE

  - VERSION_DOWNGRADE

  - REVISION_CHANGE

  - DIGEST_CHANGE

  - REPLACEMENT

  - REMOVAL


# =============================================================================
# 3. VERSION POLICIES
# =============================================================================

version_policies:

  EXACT:
    description: >
      The selected version must exactly match the specified version.

  RANGE:
    description: >
      The component may operate inside an explicitly defined version range.

  MINIMUM:
    description: >
      The component must be at least the specified version.

  COMPATIBLE:
    description: >
      The component may vary within a documented compatibility contract.

  REVISION:
    description: >
      The component is identified by an immutable source or artifact revision.

  DIGEST:
    description: >
      The component is identified by an immutable artifact digest.


# =============================================================================
# 4. EVALUATION CRITERIA
# =============================================================================

evaluation_criteria:

  architecture_compatibility:
    weight: 0
    required: true
    description: >
      Compatibility with JAS architecture and Approved Stack decisions.

  functional_capability:
    weight: 0
    required: true
    description: >
      Whether the candidate provides the capabilities required by JARVIS.

  api_stability:
    weight: 0
    required: true
    description: >
      Stability and compatibility of the public API.

  backward_compatibility:
    weight: 0
    required: true
    description: >
      Compatibility with existing JARVIS components.

  performance:
    weight: 0
    required: true
    description: >
      Runtime performance and throughput.

  latency:
    weight: 0
    required: false
    description: >
      Relevant latency characteristics.

  resource_usage:
    weight: 0
    required: true
    description: >
      CPU, RAM, GPU, VRAM, disk, and other resource requirements.

  scalability:
    weight: 0
    required: false
    description: >
      Ability to scale with future JARVIS workloads.

  reliability:
    weight: 0
    required: true
    description: >
      Operational stability and production reliability.

  security:
    weight: 0
    required: true
    description: >
      Security posture and known vulnerability exposure.

  supply_chain:
    weight: 0
    required: true
    description: >
      Integrity and provenance of the dependency or artifact.

  maintenance:
    weight: 0
    required: true
    description: >
      Long-term maintenance viability.

  support_lifecycle:
    weight: 0
    required: true
    description: >
      Current support state and expected lifecycle.

  documentation:
    weight: 0
    required: false
    description: >
      Quality and completeness of documentation.

  ecosystem:
    weight: 0
    required: false
    description: >
      Ecosystem maturity and integration availability.

  license:
    weight: 0
    required: true
    description: >
      Compatibility with JARVIS licensing and distribution requirements.

  bootstrap_compatibility:
    weight: 0
    required: true
    description: >
      Ability to provision deterministically through Bootstrap.

  platform_compatibility:
    weight: 0
    required: true
    description: >
      Compatibility with supported JARVIS platforms.

  reproducibility:
    weight: 0
    required: true
    description: >
      Ability to reproduce the selected state reliably.

  migration_risk:
    weight: 0
    required: true
    description: >
      Risk associated with adopting the candidate version.


# =============================================================================
# 5. SCORE POLICY
# =============================================================================

score_policy:

  scale:
    minimum: 0
    maximum: 10

  interpretation:

    0:
      meaning: "Unacceptable"

    1:
      meaning: "Extremely poor"

    2:
      meaning: "Very poor"

    3:
      meaning: "Poor"

    4:
      meaning: "Below acceptable"

    5:
      meaning: "Acceptable"

    6:
      meaning: "Good"

    7:
      meaning: "Very good"

    8:
      meaning: "Strong"

    9:
      meaning: "Excellent"

    10:
      meaning: "Best available"


# =============================================================================
# 6. HARD-BLOCK CONDITIONS
# =============================================================================

hard_blocks:

  - incompatible_license

  - incompatible_architecture

  - unsupported_platform

  - critical_security_failure

  - unavailable_required_artifact

  - unreproducible_artifact

  - incompatible_runtime

  - incompatible_dependency

  - rejected_technology

  - unsupported_required_feature

  - unacceptable_supply_chain_risk


# =============================================================================
# 7. CANDIDATE RECORD
# =============================================================================

candidate_record:

  required_fields:

    - version

    - source

    - release_date

    - support_status

    - license

    - platform_compatibility

    - architecture_compatibility

    - security_status

    - reproducibility

    - rationale


