# ============================================================
# JARVIS / JAS
# VERSION LOCK v1 — VERSION LOCK CANDIDATE
# ============================================================

version_lock_candidate:

  schema_version: "1.0"

  project:
    name: "JARVIS"
    architecture: "JAS"
    architecture_version: "JAS v1"


  # ==========================================================
  # 1. DOCUMENT
  # ==========================================================

  document:

    id:
      "JAS-VL-021"

    name:
      "Version Lock Candidate"

    version:
      "1.0"

    status:
      "CANDIDATE_NOT_FINAL"

    authority:
      - "JAS v1"
      - "Approved Stack v1.0"
      - "Version Lock Component Inventory"
      - "Cross Domain Compatibility Validation"

    final_lock:
      false


  # ==========================================================
  # 2. CANDIDATE RULE
  # ==========================================================

  candidate_rule:

    description:
      >
      A candidate is a proposed exact implementation identity that
      has passed initial architectural screening but has not yet
      passed every final Version Lock gate.

    important:

      candidate_is_not_final:
        true

      newest_is_not_automatically_selected:
        true

      exact_identity_required:
        true

      immutable_identity_preferred:
        true


  # ==========================================================
  # 3. STATUS DEFINITIONS
  # ==========================================================

  statuses:

    CANDIDATE:
      description:
        "Candidate selected for compatibility validation."

    VALIDATED:
      description:
        "Candidate passed technical compatibility validation."

    CONDITIONALLY_VALIDATED:
      description:
        "Candidate passes only under a documented deployment condition."

    BLOCKED:
      description:
        "Candidate cannot proceed until a dependency or decision is resolved."

    REJECTED:
      description:
        "Candidate is explicitly rejected."

    LOCKED:
      description:
        "Candidate has been promoted into final Version Lock."


  # ==========================================================
  # 4. PRIMARY PLATFORM
  # ==========================================================

  platform:

    development:

      os:
        "Windows"

      architecture:
        "x86_64"

      status:
        "CANDIDATE"


    primary_runtime:

      os:
        "Linux"

      architecture:
        "x86_64"

      status:
        "CANDIDATE"


    secondary_runtime:

      - "Linux arm64"
      - "macOS arm64"


    policy:
      >
      Linux x86_64 is the primary production target.
      Windows x86_64 is the primary development target.


  # ==========================================================
  # 5. CORE RUNTIME
  # ==========================================================

  runtimes:

    python:

      family:
        "CPython"

      minimum:
        "3.12"

      exact_version:
        null

      status:
        "BLOCKED"

      blocker:
        "Exact Python release must be selected after AI/runtime dependency validation."


    node:

      selected_line:
        "24.x LTS"

      exact_version:
        "24.18.1"

      status:
        "CANDIDATE"

      source_validation:
        >
        Node.js 24.x is an LTS line. Exact patch release must remain
        synchronized with the official Node.js release state at the
        final lock timestamp.

      note:
        >
        Node.js 24.18.1 is retained as the candidate from the previous
        resolution pass. It must be revalidated against the final
        lock timestamp before promotion.

      final_lock:
        false


  # ==========================================================
  # 6. PYTHON TOOLCHAIN
  # ==========================================================

  python_toolchain:

    package_manager:

      name:
        "uv"

      exact_version:
        null

      status:
        "BLOCKED"


    metadata:

      file:
        "pyproject.toml"

      status:
        "REQUIRED"


    dependency_lock:

      file:
        "uv.lock"

      status:
        "REQUIRED"


    resolution_policy:

      >
      The final Python dependency graph SHALL be generated from
      pyproject.toml and captured in uv.lock.

    promotion_requirement:

      - "Exact Python version"
      - "Exact uv version"
      - "Complete uv.lock"
      - "Successful clean installation"
      - "Test suite pass"


  # ==========================================================
  # 7. BACKEND
  # ==========================================================

  backend:

    fastapi:

