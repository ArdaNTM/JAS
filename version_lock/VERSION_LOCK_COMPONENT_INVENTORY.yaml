# ============================================================
# JARVIS / JAS
# VERSION LOCK v1 — COMPONENT INVENTORY
# RECONCILED BASELINE v1.1
# ============================================================

version_lock_component_inventory:
  schema_version: "1.1"

  project:
    name: "JARVIS"
    architecture: "JAS"
    architecture_version: "JAS v1"

  inventory:
    version: "1.1"
    status: "RECONCILED_BASELINE"
    authority:
      primary: "JAS v1"
      secondary:
        - "Approved Stack v1.0"
        - "19_APPROVED_MODELS.md"
        - "20_APPROVED_MCP_SERVERS.md"
        - "21_APPROVED_SOFTWARE_MATRIX.md"
        - "24_VERSION_SUPPORT_POLICY.md"

  # ----------------------------------------------------------
  # INVENTORY RULE
  # ----------------------------------------------------------
  #
  # This document identifies every component that may participate
  # in the JARVIS v1 production dependency graph.
  #
  # It does NOT yet select exact production versions.
  #
  # Exact:
  #   versions
  #   revisions
  #   commits
  #   artifact digests
  #   container digests
  #   model revisions
  #   browser revisions
  #
  # are resolved during Version Resolution.
  #
  # INVENTORY != VERSION LOCK
  #
  # ----------------------------------------------------------

  status_definitions:

    LOCK_REQUIRED:
      description: >
        Component is part of the mandatory production baseline and
        requires an exact immutable identity before release.

    LOCK_REQUIRED_IF_USED:
      description: >
        Component requires an exact lock when the corresponding
        optional, conditional or profile-dependent capability is enabled.

    ARCHITECTURAL_REFERENCE:
      description: >
        Component represents an architectural abstraction, standard,
        capability or interface rather than one immutable artifact.

    CANDIDATE:
      description: >
        Technology is approved as a candidate but exact production
        adoption requires implementation and compatibility validation.

    INTERNAL:
      description: >
        JARVIS-owned component governed by the JARVIS release system.

