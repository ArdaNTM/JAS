# ============================================================
# JARVIS / JAS
# VERSION LOCK v1
# FINAL EXACT VERSION RESOLUTION
# ============================================================

final_exact_version_resolution:

  schema_version: "1.0"

  project:
    name: "JARVIS"
    architecture: "JAS"
    architecture_version: "JAS v1"


  # ==========================================================
  # 1. DOCUMENT
  # ==========================================================

  document:

    id: "JAS-VL-024"

    name:
      "Final Exact Version Resolution"

    version: "1.0"

    status:
      "RESOLUTION_IN_PROGRESS"

    final_version_lock:
      false

    authority:
      - "JAS v1"
      - "Approved Stack v1.0"
      - "19_APPROVED_MODELS.md"
      - "20_APPROVED_MCP_SERVERS.md"
      - "21_VERSION_LOCK_CANDIDATE.yaml"
      - "22_CANDIDATE_EVIDENCE_AND_EXACT_VERSION_RESOLUTION.yaml"
      - "23_FINAL_COMPATIBILITY_AND_LOCK_PREPARATION.yaml"


  # ==========================================================
  # 2. RESOLUTION POLICY
  # ==========================================================

  policy:

    exact_version_required:
      true

    exact_revision_required:
      true

    digest_required_where_available:
      true

    newest_version_is_not_automatically_selected:
      true

    compatibility_over_recency:
      true

    hardware_compatibility_over_model_size:
      true

    official_source_preferred:
      true

    immutable_identity_required_for_release:
      true

    candidate_is_not_lock:
      true

    mutable_latest_tags_forbidden:
      true


  # ==========================================================
  # 3. RESOLUTION STATES
  # ==========================================================

  states:

    UNRESOLVED:
      meaning:
        "No candidate can yet be selected safely."

    CANDIDATE:
      meaning:
        "Candidate discovered but not fully validated."

    RESOLVED:
      meaning:
        "Exact candidate selected with sufficient evidence."

    COMPATIBILITY_BLOCKED:
      meaning:
        "Exact version cannot be finalized because a connected component is unresolved."

    HARDWARE_BLOCKED:
      meaning:
        "Resolution depends on an unresolved hardware profile."

    LICENSE_BLOCKED:
      meaning:
        "License review prevents promotion."

    SECURITY_BLOCKED:
      meaning:
        "Security validation prevents promotion."

    READY_FOR_LOCK:
      meaning:
        "Candidate may be transferred to final VERSION_LOCK.yaml."


  # ==========================================================
  # 4. HARDWARE PROFILE
  # ==========================================================

  hardware_profile:

    status:
      "RESOLVED"

    host:

      operating_system:
        "Windows 11"

      architecture:
        "x86_64"

      system_ram_gb:
        16


    gpu:

      vendor:
        "NVIDIA"

      model:
        "GeForce GTX 1660 Ti"

      vram_gb:
        6

      architecture:
        "Turing"

      compute_capability:
        "7.5"


    deployment_role:

      development:
        true

      local_llm_inference:
        true

      production_reference:
        "Current personal development hardware"


    evidence:

      source:
        "Existing JAS hardware profile; host nvidia-smi validation on 2026-08-12"

      exact_driver_version:
        "610.62"

      driver_validation:
        "VALIDATED_2026-08-12"


