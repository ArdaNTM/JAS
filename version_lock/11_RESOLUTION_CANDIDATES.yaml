# ============================================================
# JARVIS / JAS
# VERSION LOCK v1 — RESOLUTION CANDIDATES
# ============================================================

version_lock_resolution_candidates:

  schema_version: "1.0"

  project:
    name: "JARVIS"
    architecture: "JAS"
    architecture_version: "JAS v1"

  document:
    id: "JAS-VL-011"
    name: "Resolution Candidates"
    version: "1.0"
    status: "CANDIDATE"
    authority: "VERSION_LOCK_v1"


  # ==========================================================
  # 1. PURPOSE
  # ==========================================================

  purpose:
    >
    This document records candidate versions, revisions, artifacts
    and implementation variants considered during Version Lock v1
    resolution.

    Candidates are not final production locks.

    A candidate may only become LOCKED after passing the mandatory
    compatibility, security, licensing, platform, integrity and
    reproducibility requirements defined by the Version Lock system.


  # ==========================================================
  # 2. CANDIDATE STATUS DEFINITIONS
  # ==========================================================

  statuses:

    RESEARCH_REQUIRED:
      description:
        "Authoritative release information has not yet been collected."

    CANDIDATE:
      description:
        "Candidate is technically eligible for evaluation."

    COMPATIBILITY_PASS:
      description:
        "Candidate passed required compatibility checks."

    SECURITY_PASS:
      description:
        "Candidate passed required security checks."

    LICENSE_PASS:
      description:
        "Candidate passed license validation."

    PLATFORM_PASS:
      description:
        "Candidate passed supported platform validation."

    APPROVED_CANDIDATE:
      description:
        "Candidate passed all pre-lock evaluation stages."

    REJECTED:
      description:
        "Candidate failed one or more mandatory requirements."

    LOCKED:
      description:
        "Candidate has been promoted to the final Version Lock."

    SUPERSEDED:
      description:
        "Candidate was replaced by another candidate."


  # ==========================================================
  # 3. CANDIDATE RECORD
  # ==========================================================

  candidate_schema:

    required:

      - "candidate_id"
      - "component_id"
      - "name"
      - "source"
      - "version"
      - "revision"
      - "artifact"
      - "platform"
      - "architecture"
      - "status"
      - "evaluation"

    evaluation:

      compatibility:
        required: true

      security:
        required: true

      license:
        required: true

      platform:
        required: true

      reproducibility:
        required: true


  # ==========================================================
  # 4. CORE RUNTIME CANDIDATES
  # ==========================================================

  core_runtime:

    python:

      component_id: "SW-001"

      candidates: []

      selection_constraints:

        version_family:
          "Python 3.12+"

        implementation:
          "CPython"

        platforms:
          - "Windows"
          - "Linux"
          - "macOS"

        architectures:
          - "x86_64"
          - "ARM64"

      mandatory_validation:

        - "AI ecosystem compatibility"
        - "uv compatibility"
        - "FastAPI compatibility"
        - "Pydantic compatibility"
        - "LangGraph compatibility"
        - "Windows support"
        - "Linux support"


    cpython:

      component_id: "CPYTHON-001"

      candidates: []

      required_identity:

        - "release"
        - "source_revision"
        - "platform_artifact"
        - "architecture"
        - "artifact_digest"


  # ==========================================================
  # 5. PYTHON ECOSYSTEM
  # ==========================================================

  python:

    uv:

      component_id: "SW-026"

      candidates: []

      required_identity:

        - "version"
        - "platform"
        - "architecture"
        - "artifact_digest"


    fastapi:

      component_id: "SW-005"

      candidates: []

      compatibility_targets:

