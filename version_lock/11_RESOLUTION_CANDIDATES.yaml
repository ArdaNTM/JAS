  # ==========================================================
  # 17. CANDIDATE EVALUATION TEMPLATE
  # ==========================================================

  evaluation_template:

    candidate_id: null

    component_id: null

    source:
      registry: null
      repository: null
      release_page: null

    identity:

      version: null

      revision: null

      artifact: null

      digest: null

      platform: null

      architecture: null


    compatibility:

      runtime: "PENDING"

      dependencies: "PENDING"

      models: "PENDING"

      mcp: "PENDING"

      platform: "PENDING"

      hardware: "PENDING"


    security:

      vulnerability_status: "PENDING"

      integrity_status: "PENDING"

      provenance_status: "PENDING"

      signature_status: "PENDING"


    license:

      status: "PENDING"

      license: null


    reproducibility:

      status: "PENDING"

      deterministic_install: false

      immutable_identity: false


    decision:

      status: "RESEARCH_REQUIRED"

      reason: null


  # ==========================================================
  # 18. CANDIDATE SELECTION RULES
  # ==========================================================

  selection_rules:

    rule_001:
      >
      A candidate SHALL originate from an authoritative or
      explicitly approved source.

    rule_002:
      >
      A candidate SHALL satisfy the minimum supported runtime
      requirements.

    rule_003:
      >
      A candidate SHALL not introduce an unresolved mandatory
      dependency conflict.

    rule_004:
      >
      A candidate SHALL not introduce a known critical security
      vulnerability.

    rule_005:
      >
      A candidate SHALL have a valid license compatible with JAS.

    rule_006:
      >
      A candidate SHALL be reproducibly installable.

    rule_007:
      >
      A candidate SHALL have an immutable identity before promotion
      to LOCKED.

    rule_008:
      >
      A candidate SHALL pass platform validation for every platform
      claimed as supported.

    rule_009:
      >
      Model candidates SHALL be evaluated together with their
      inference runtime and hardware requirements.

    rule_010:
      >
      MCP server candidates SHALL be evaluated together with their
      protocol, SDK, transport and permission requirements.


  # ==========================================================
  # 19. RESEARCH RECORD
  # ==========================================================

  research:

    methodology:

      source_priority:

        1:
          "Official project release documentation"

        2:
          "Official package registry"

        3:
          "Official repository"

        4:
          "Official security advisory"

        5:
          "Official container registry"

        6:
          "Trusted secondary technical source"

      secondary_sources:
        >
        Secondary sources may be used for discovery and cross-checking,
        but final version identity SHALL be established from an
        authoritative source whenever possible.


    records: []


  # ==========================================================
  # 20. CURRENT STATE
  # ==========================================================

  current_state:

    candidate_collection_started: false

    candidates_collected: 0

    candidates_approved: 0

    candidates_rejected: 0

    components_ready_for_lock: 0

    final_locked_components: 0

    status:
      "CANDIDATE_COLLECTION_NOT_STARTED"


  # ==========================================================
  # 21. NEXT PHASE
  # ==========================================================

  next_phase:

    name:
      "Authoritative Candidate Collection"

    sequence:

      - "Research official releases"
      - "Record candidate versions"
      - "Record immutable revisions"
      - "Record platform artifacts"
      - "Record dependency requirements"
      - "Record security advisories"
      - "Record license information"
      - "Record model compatibility"
      - "Record MCP compatibility"
      - "Reject invalid candidates"
      - "Promote technically valid candidates"
      - "Pass candidates to Version Resolution Matrix"
      - "Proceed toward final Version Lock"


  governing_rule:
    >
    This document records candidates only. No candidate SHALL be
    considered a production lock until it has passed the complete
    Version Lock resolution and validation process.