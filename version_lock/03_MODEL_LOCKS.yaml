```yaml
# ============================================================
# JARVIS / JAS
# VERSION LOCK v1 — MODEL LOCKS
# ============================================================

version_lock_model_locks:

  schema_version: "1.0"

  project:
    name: "JARVIS"
    architecture: "JAS"
    architecture_version: "JAS v1"

  lock:
    version: "1.0"
    status: "CANDIDATE"
    authority: "VERSION_LOCK_v1"

  # ----------------------------------------------------------
  # IMPORTANT
  # ----------------------------------------------------------
  #
  # A model family name is NOT a production lock identity.
  #
  # Every production model SHALL identify, where applicable:
  #
  #   provider / organization
  #   repository
  #   exact variant
  #   revision
  #   artifact format
  #   quantization
  #   runtime
  #   artifact digest
  #   license
  #
  # Mutable references such as "main" SHALL NOT be used as the
  # final production revision.
  #
  # ==========================================================


  # ==========================================================
  # 1. LOCAL PRIMARY LLM
  # ==========================================================

  llm:

    - id: "MODEL-LLM-QWEN3"

      family: "Qwen3"

      provider:
        organization: "Qwen"
        publisher: "Alibaba Cloud / Qwen Team"

      repository:
        selected: null
        candidate_repositories:
          - "Qwen/Qwen3-8B"
          - "Qwen/Qwen3-30B-A3B"

      deployment:
        type: "LOCAL"
        production_required: true

      status:
        approved: true
        lock_status: "CANDIDATE_LOCK"
        final_status: "PENDING_VARIANT_SELECTION"

      license:
        declared_family_license: "Apache-2.0"
        exact_artifact_validation_required: true
        validation_status: "PENDING"

      variant:
        selected: null

      candidate_variants:

        - name: "Qwen3-8B"
          repository: "Qwen/Qwen3-8B"
          parameter_class: "8.2B"
          architecture: "Dense"
          context:
            native_tokens: 32768
            extended_tokens: 131072
          status: "CANDIDATE"

        - name: "Qwen3-30B-A3B"
          repository: "Qwen/Qwen3-30B-A3B"
          parameter_class: "30B total / 3B activated"
          architecture: "MoE"
          status: "CANDIDATE"

      revision:
        value: null
        type: "HUGGINGFACE_COMMIT"
        mutable_reference_prohibited: true

      artifact:
        format: null
        source_format_candidates:
          - "Safetensors"
          - "GGUF"
          - "Other approved runtime-specific artifact"
        digest:
          algorithm: "SHA-256"
          value: null

      quantization:
        selected: null
        candidates:
          - "FP16"
          - "BF16"
          - "INT8"
          - "INT4"
          - "GGUF quantization"
        status: "PENDING_HARDWARE_VALIDATION"

      runtime:
        selected: null
        candidates:
          - "Transformers"
          - "vLLM"
          - "SGLang"
          - "Other approved local runtime"
        version: null

      tokenizer:
        repository_revision: null
        artifact_digest: null

      hardware_profile:
        selected: null
        cpu_support: true
        gpu_required: null
        vram_requirement: null
        architecture: null

      evaluation:
        reasoning: "PENDING"
        coding: "PENDING"
        tool_use: "PENDING"
        agentic_workflows: "PENDING"
        multilingual: "PENDING"
        latency: "PENDING"
        memory_usage: "PENDING"

      rationale:
        - >
          Qwen3 is the approved local LLM family for JAS v1.
        - >
          The exact checkpoint must be selected according to the
          JAS hardware profile and workload requirements.
        - >
          Qwen3 supports both reasoning and non-thinking modes.
        - >
          Qwen3 model repositories provide official Transformers
          and vLLM usage paths.

      source_validation:
        official_model_card_verified: true
        repository_revision_verified: false
        artifact_digest_verified: false
        license_verified: false

      final_status: "PENDING_VARIANT_AND_ARTIFACT_SELECTION"


  # ==========================================================
  # 2. EMBEDDING MODEL
