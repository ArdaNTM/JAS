  # ==========================================================
  # 10. MODEL IDENTITY REQUIREMENTS
  # ==========================================================

  identity_requirements:

    mandatory_fields:

      - "provider_or_organization"
      - "repository"
      - "model_family"
      - "exact_variant"
      - "revision"
      - "artifact_format"
      - "license"

    conditional_fields:

      - "quantization"
      - "runtime"
      - "artifact_digest"
      - "tokenizer_revision"
      - "tokenizer_digest"
      - "adapter_revision"
      - "backbone_revision"

    prohibited_final_references:

      - "main"
      - "master"
      - "latest"
      - "unversioned mutable repository state"


  # ==========================================================
  # 11. MODEL ARTIFACT INTEGRITY
  # ==========================================================

  integrity:

    required_for_production: true

    preferred_algorithm:
      "SHA-256"

    verification_sequence:

      - "Resolve immutable model revision"
      - "Enumerate required artifacts"
      - "Acquire artifact"
      - "Calculate digest"
      - "Compare expected digest"
      - "Verify source authority"
      - "Verify license"
      - "Record artifact identity"

    mismatch_action:
      "FAIL_INSTALLATION"


  # ==========================================================
  # 12. MODEL LICENSE GOVERNANCE
  # ==========================================================

  license_governance:

    validation_required: true

    checks:

      - "Model repository license"
      - "Model weights license"
      - "Tokenizer license where separately licensed"
      - "Adapter license"
      - "Backbone license"
      - "Voice model license"
      - "Gated-access terms"
      - "Redistribution restrictions"

    production_rule:
      >
      A model SHALL NOT become production LOCKED until the exact
      selected artifact and its applicable license terms have been
      validated.


  # ==========================================================
  # 13. HARDWARE COMPATIBILITY
  # ==========================================================

  hardware_validation:

    required: true

    dimensions:

      - "CPU compatibility"
      - "GPU compatibility"
      - "VRAM requirement"
      - "RAM requirement"
      - "Storage requirement"
      - "Inference latency"
      - "Throughput"
      - "Thermal stability"

    profiles:

      cpu:
        enabled: true

      gpu:
        enabled: true

      low_vram:
        enabled: true

      high_vram:
        enabled: true

      development:
        enabled: true

      production:
        enabled: true


  # ==========================================================
  # 14. MODEL EVALUATION GATE
  # ==========================================================

  evaluation_gate:

    required_before_lock:

      - "Functional inference test"
      - "Artifact integrity test"
      - "License validation"
      - "Runtime compatibility"
      - "Hardware compatibility"
      - "Latency benchmark"
      - "Memory benchmark"
      - "Quality benchmark"

    llm_additional:

      - "Reasoning evaluation"
      - "Coding evaluation"
      - "Tool-use evaluation"
      - "Agent workflow evaluation"
      - "Multilingual evaluation"

    embedding_additional:

      - "Retrieval benchmark"
      - "Vector dimension verification"
      - "Qdrant integration test"

    reranker_additional:

      - "Reranking benchmark"
      - "Top-k relevance evaluation"

    stt_additional:

      - "WER evaluation"
      - "Language-specific accuracy"
      - "Noisy audio evaluation"
      - "Realtime factor"

    vision_additional:

      - "Image-text matching"
      - "Visual retrieval"
      - "Document understanding"


  # ==========================================================
  # 15. CURRENT MODEL LOCK STATUS
  # ==========================================================

  summary:

    production_candidate:

      - "Qwen3 family"
      - "BAAI/bge-m3"
      - "BAAI/bge-reranker-v2-m3"
      - "OpenAI Whisper Large V3"
      - "SigLIP 2 family"


    conditional:

      - "Whisper Turbo"
      - "Piper"
      - "PaliGemma 2"
      - "ColPali"


    unresolved:

      - "Qwen3 exact production variant"
      - "Qwen3 immutable revision"
      - "Qwen3 artifact format"
      - "Qwen3 quantization"
      - "Qwen3 runtime"
      - "BGE-M3 immutable revision"
      - "BGE-M3 artifact digest"
      - "BGE reranker immutable revision"
      - "BGE reranker artifact digest"
      - "Whisper Large V3 immutable revision"
      - "Whisper artifact digest"
      - "SigLIP2 exact checkpoint"
      - "SigLIP2 revision"
      - "SigLIP2 artifact digest"


  # ==========================================================
  # 16. VALIDATION STATE
  # ==========================================================

  validation:

    model_families_validated: true

    exact_variants_locked: false

    immutable_revisions_locked: false

    artifact_digests_locked: false

    runtime_versions_locked: false

    hardware_profiles_locked: false

    license_validation_complete: false

    security_validation_complete: false

    benchmark_validation_complete: false

    final_lock_status: "CANDIDATE"


  # ==========================================================
  # 17. NEXT PHASE
  # ==========================================================

  next_phase:

    name: "Exact Model Variant Resolution"

    sequence:

      - "Select Qwen3 production variant"
      - "Select Qwen3 runtime"
      - "Select Qwen3 artifact format"
      - "Select Qwen3 quantization"
      - "Resolve Qwen3 immutable repository revision"
      - "Resolve Qwen3 artifact digest"
      - "Resolve BGE-M3 immutable revision"
      - "Resolve BGE-M3 artifact digest"
      - "Resolve BGE reranker immutable revision"
      - "Resolve BGE reranker artifact digest"
      - "Resolve Whisper Large V3 immutable revision"
      - "Resolve Whisper artifact digest"
      - "Select SigLIP2 checkpoint"
      - "Resolve SigLIP2 immutable revision"
      - "Resolve SigLIP2 artifact digest"
      - "Validate exact licenses"
      - "Validate hardware compatibility"
      - "Run model benchmarks"
      - "Promote validated model identities to LOCKED"

  governing_rule: >
    A model family SHALL NEVER be considered production locked
    without an exact checkpoint, immutable revision and verified
    artifact identity where technically available.
