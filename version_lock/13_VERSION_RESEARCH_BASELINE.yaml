# ============================================================
# JARVIS / JAS
# VERSION LOCK v1 — VERSION RESEARCH BASELINE
# ============================================================

version_research_baseline:

  schema_version: "1.0"

  project:
    name: "JARVIS"
    architecture: "JAS"
    architecture_version: "JAS v1"

  document:
    id: "JAS-VL-013"
    name: "Version Research Baseline"
    version: "1.0"
    status: "RESEARCH_BASELINE"
    authority: "VERSION_LOCK_v1"

  research:
    verification_date: "2026-08-10"
    verification_timezone: "Europe/Berlin"

    purpose:
      >
      Records externally verified candidate versions discovered
      during Version Lock v1 research.

      Entries in this document are research candidates only.
      They are not final production locks.

    governing_documents:
      - "10_VERSION_RESOLUTION_MATRIX.yaml"
      - "11_RESOLUTION_CANDIDATES.yaml"
      - "12_AUTHORITATIVE_VERSION_SOURCES.yaml"


  # ==========================================================
  # 1. RESEARCH STATUS
  # ==========================================================

  status_definitions:

    VERIFIED_CANDIDATE:
      >
      Version was observed in an authoritative source and may
      proceed to compatibility evaluation.

    PARTIALLY_VERIFIED:
      >
      Version was observed but one or more required identity
      fields remain unresolved.

    COMPATIBILITY_REQUIRED:
      >
      Upstream identity is known but compatibility testing is
      still required.

    SECURITY_REQUIRED:
      >
      Security validation remains incomplete.

    REJECTED:
      >
      Candidate failed a mandatory requirement.

    APPROVED_CANDIDATE:
      >
      Candidate passed all required pre-lock evaluations.

    LOCKED:
      >
      Candidate has been promoted to final Version Lock.


  # ==========================================================
  # 2. CORE RUNTIME
  # ==========================================================

  core_runtime:

    python:

      component_id: "SW-001"

      source:
        authority: "Python Software Foundation"
        source_type: "Official Python release"
        verification_status: "VERIFIED"

      candidate:

        version: "3.14.6"
        implementation: "CPython"
        release_series: "3.14"
        release_status: "STABLE"

      evidence:

        release_date: "2026-06-10"

        note:
