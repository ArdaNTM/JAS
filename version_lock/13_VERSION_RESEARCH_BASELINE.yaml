          Python 3.14.6 is the sixth maintenance release of the
          Python 3.14 series.

      compatibility:

        fastapi: "PENDING"
        pydantic: "PENDING"
        langgraph: "PENDING"
        uv: "PENDING"
        ai_stack: "PENDING"

      platform:

