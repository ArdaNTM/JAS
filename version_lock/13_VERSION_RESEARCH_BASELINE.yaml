  # ==========================================================
  # 7. IMPORTANT VERSION-LOCK RULE
  # ==========================================================

  lock_policy:

    observed_latest_version:
      >
      An observed latest version is a candidate only.

    final_lock_requires:

      - "Dependency compatibility"
      - "Runtime compatibility"
      - "Platform compatibility"
      - "Security validation"
      - "License validation"
      - "Artifact integrity"
      - "Reproducible installation"

    mutable_references:

      forbidden:

        - "latest"
        - "main"
        - "master"
        - "floating model tags"
        - "unbounded dependency ranges"


