# ============================================================
# JARVIS / JAS
# VERSION LOCK v1 — COMPATIBILITY RESOLUTION
# ============================================================

version_lock_compatibility_resolution:

  schema_version: "1.1"

  project:
    name: "JARVIS"
    architecture: "JAS"
    architecture_version: "JAS v1"


  # ==========================================================
  # 1. DOCUMENT
  # ==========================================================

  document:

    id: "JAS-VL-014"

    name: "Compatibility Resolution"

    version: "1.1"

    status: "IN_PROGRESS"

    authority:
      - "VERSION_LOCK_v1"
      - "JAS v1"
      - "21_VERSION_LOCK_CANDIDATE.yaml"
      - "22_CANDIDATE_EVIDENCE_AND_EXACT_VERSION_RESOLUTION.yaml"
      - "24_FINAL_EXACT_VERSION_RESOLUTION.yaml"
      - "HOST_SNAPSHOT_2026-08-13"


  # ==========================================================
  # 2. PURPOSE
  # ==========================================================

  purpose:
    >
    This document determines whether candidate versions collected
    during Version Lock v1 can coexist as a technically valid,
    reproducible and supportable JAS runtime.

    Compatibility is evaluated as a system rather than as isolated
    package selections.

    A component SHALL NOT be promoted to LOCKED solely because its
    own release is valid.

    Its interaction with the complete JAS dependency graph SHALL
    also be validated.

    Host-installed software SHALL be treated as observational
    evidence until acquisition, version verification, compatibility
    validation and lock identity requirements have been satisfied.


  # ==========================================================
  # 3. COMPATIBILITY STATES
  # ==========================================================

  states:

    UNKNOWN:
      description:
        "Compatibility has not yet been evaluated."

    OBSERVED:
      description:
        >
        The component has been observed on the current host, but
        observation alone does not establish JAS compatibility or
        production lock eligibility.

    PASS:
      description:
        "Compatibility requirement is satisfied."

    PASS_WITH_CONSTRAINT:
      description:
        "Compatible only under an explicit architectural constraint."

    PENDING:
      description:
        "Evaluation requires additional evidence or testing."

    FAIL:
      description:
        "Candidate is incompatible."

    NOT_APPLICABLE:
      description:
        "Compatibility relationship does not apply."

    BLOCKED:
      description:
        >
        Evaluation cannot proceed because an upstream dependency,
        architectural decision or required evidence is unresolved.

    CONDITIONAL:
      description:
        >
        Component is required only when the corresponding optional
        or conditional architecture path is enabled.


  # ==========================================================
  # 4. GLOBAL RULES
  # ==========================================================

  rules:

    rule_001:
      >
      A final runtime SHALL support every mandatory production
      dependency required by JAS.

    rule_002:
      >
      A dependency SHALL support the selected runtime.

    rule_003:
      >
      A model SHALL be evaluated together with its selected
      inference runtime.

    rule_004:
      >
      GPU-dependent components SHALL be evaluated together with
      the hardware and runtime path that actually uses the GPU.

    rule_005:
      >
      Direct PyTorch/CUDA compatibility SHALL NOT be treated as a
      mandatory primary LLM requirement when the selected primary
      inference architecture is Ollama.

    rule_006:
      >
      Browser automation SHALL be evaluated using the exact
      Playwright/browser revision relationship.

    rule_007:
      >
      MCP clients and servers SHALL be evaluated against the
      selected protocol revision.

    rule_008:
      >
      Container images SHALL be evaluated together with their
      architecture and host platform requirements.

    rule_009:
      >
      A package metadata PASS SHALL NOT be treated as equivalent
      to complete runtime validation.

    rule_010:
      >
      Compatibility SHALL be re-evaluated whenever a dependency
      candidate changes.

    rule_011:
      >
      A single compatibility failure in a mandatory production
      component SHALL prevent final Version Lock promotion.

    rule_012:
      >
      Host observation SHALL NOT automatically become a JAS lock
      decision.

    rule_013:
      >
      Exact versions SHALL be resolved before final lock promotion.

    rule_014:
      >
      Mutable latest tags SHALL NOT be used as final immutable
      production identities.

    rule_015:
      >
      Optional architecture branches SHALL NOT block the primary
      JAS runtime unless that branch is explicitly enabled.


